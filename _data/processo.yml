- titolo: Costruzione
  testo: Costruiamo la tua abitazione o il capannone per la tua attività. Un unico interlocutore dal primo sopralluogo alla fine dei lavori.
- titolo: Vendita
  testo: Chi ha costruito la tua casa è lo stesso che ti segue nell'acquisto, con tutti i dettagli per scegliere in modo consapevole.
- titolo: Post vendita
  testo: Dopo la consegna trovi assistenza e passione di chi ha costruito per te come se fosse per sé.
