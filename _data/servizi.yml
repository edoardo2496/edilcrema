- slug: "residenziale"
  nome: "Edilizia residenziale"
  sottotitolo: "Case e appartamenti consegnati chiavi in mano"
  descrizione: "Costruiamo case e appartamenti curati in ogni dettaglio. Ti seguiamo dal progetto alla consegna, e anche dopo, con lo stesso interlocutore."
  plus_distintivo: "Incluso nel capitolato: un architetto a tua disposizione per guidarti nella scelta di arredi e finiture degli interni."
  immagine: "/assets/img/brand/servizi/residenziale.jpg"
  tag:
    - "Case e appartamenti"
    - "Chiavi in mano"
  punti_chiave:
    - "Un unico interlocutore dalla progettazione alla consegna"
    - "Consulenza di un architetto per gli interni, inclusa nel capitolato"
    - "Assistenza continuativa anche dopo la consegna dell'immobile"

- slug: "industriale"
  nome: "Edilizia industriale"
  sottotitolo: "Prefabbricati industriali su misura per la tua attività"
  descrizione: "Realizziamo prefabbricati industriali per qualunque tipo di attività. Adattiamo la struttura alle reali necessità operative della tua azienda, come un sarto fa con un abito, per consegnarti lo spazio perfetto in cui far crescere il tuo lavoro."
  plus_distintivo: "Ogni prefabbricato è modellato sui flussi produttivi e logistici specifici della tua attività."
  immagine: "/assets/img/brand/servizi/industriale.jpg"
  tag:
    - "Prefabbricati industriali"
    - "Strutture produttive"
  punti_chiave:
    - "Progettazione sulle esigenze operative dell'azienda"
    - "Ottimizzazione degli spazi produttivi, logistici e direzionali"
    - "Rispetto rigoroso delle tempistiche di consegna aziendali"

- slug: "urbanizzazione"
  nome: "Urbanistica e urbanizzazioni"
  sottotitolo: "Infrastrutture, lottizzazioni e armonizzazione del territorio"
  descrizione: "Collaboriamo con i comuni del Veneto e con operatori privati per realizzare, a regola d'arte, opere di urbanizzazione primaria e secondaria ben integrate nel territorio."
  plus_distintivo: "Partner del territorio: dialogo costante con gli enti locali del Veneto per opere durevoli e ben integrate."
  immagine: "/assets/img/brand/servizi/urbanizzazione-2.jpg"
  tag:
    - "Lottizzazioni"
    - "Opere di urbanizzazione"
  punti_chiave:
    - "Reti fognarie, acquedotti e sottoservizi completi"
    - "Realizzazione di strade, parcheggi e asfaltature"
    - "Illuminazione pubblica e sistemazione delle aree verdi"
