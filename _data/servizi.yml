- slug: "residenziale"
  nome: "Edilizia residenziale"
  sottotitolo: "Case e appartamenti consegnati chiavi in mano"
  descrizione: "Costruiamo case e appartamenti curati in ogni dettaglio e li consegniamo chiavi in mano. Ti seguiamo dal progetto alla consegna, e anche dopo, affiancandoti con un architetto dedicato per trasformare gli spazi nella casa dei tuoi sogni."
  plus_distintivo: "Incluso nel capitolato: un architetto a tua disposizione per guidarti in tutta la fase di arredamento e finitura degli interni."
  immagine: "/assets/img/servizi/residenziale.jpg"
  tag:
    - "Case e Appartamenti"
    - "Chiavi in mano"
    - "Architetto incluso"
  punti_chiave:
    - "Consegna chiavi in mano senza pensieri per il cliente"
    - "Consulenza di un architetto per l'arredamento interno inclusa nel capitolato"
    - "Assistenza continuativa anche dopo la consegna dell'immobile"

- slug: "industriale"
  nome: "Edilizia industriale"
  sottotitolo: "Prefabbricati industriali cuciti attorno al tuo business"
  descrizione: "Realizziamo prefabbricati industriali su misura per qualunque tipologia di attività. Adattiamo la struttura alle reali necessità operative della tua azienda per consegnarti, come un sarto fa con un abito, lo spazio perfetto per far crescere il tuo lavoro."
  plus_distintivo: "Approccio sartoriale: ogni prefabbricato è modellato sui flussi produttivi e logistici specifici della tua attività."
  immagine: "/assets/img/servizi/industriale.jpg"
  tag:
    - "Prefabbricati industriali"
    - "Progettazione su misura"
    - "Strutture produttive"
  punti_chiave:
    - "Prefabbricati industriali adattati alle esigenze del tuo business"
    - "Ottimizzazione degli spazi produttivi, logistici e direzionali"
    - "Rispetto rigoroso delle tempistiche di consegna aziendali"

- slug: "urbanizzazione"
  nome: "Urbanistica e urbanizzazioni"
  sottotitolo: "Infrastrutture, lottizzazioni e armonizzazione del territorio"
  descrizione: "Collaboriamo con i comuni del Veneto e con operatori privati per trasformare il territorio e dargli un'armonia unica, eseguendo opere di urbanizzazione primaria e secondaria a regola d'arte."
  plus_distintivo: "Partner del territorio: dialogo costante con gli enti locali del Veneto per opere durevoli e ben integrate."
  immagine: "/assets/img/servizi/urbanizzazione.jpg"
  tag:
    - "Lottizzazioni"
    - "Opere di urbanizzazione"
    - "Asfalti"
  punti_chiave:
    - "Reti fognarie, acquedotti e sottoservizi completi"
    - "Realizzazione strade, parcheggi e asfaltature"
    - "Illuminazione pubblica e sistemazione delle aree verdi"
