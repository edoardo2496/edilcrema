<article class="socio-item">
  {% if include.s.foto %}
    <img class="socio-photo" src="{{ include.s.foto | relative_url }}" alt="{{ include.s.nome }} - {{ include.s.ruolo }}" loading="lazy">
  {% endif %}
  
  {% if include.s.esperienza %}
    <span class="socio-badge">{{ include.s.esperienza }}</span>
  {% endif %}
  
  <div class="socio-role">{{ include.s.ruolo }}</div>
  <h3 class="socio-name">{{ include.s.nome }}</h3>
  <p class="socio-bio">{{ include.s.bio }}</p>
</article>
