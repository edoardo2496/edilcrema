<nav aria-label="Navigazione principale">
  <a class="nav-logo" href="{{ '/' | relative_url }}">
    <img src="{{ '/assets/img/brand/logo.png' | relative_url }}"
         alt=""
         height="46"
         class="nav-logo-img">
    <span class="nav-logo-text">{{ site.data.azienda.nome | escape }}</span>
  </a>

  <button class="menu-btn" type="button"
          aria-expanded="false"
          aria-controls="nav-links"
          aria-label="Apri menu">
    <span></span>
  </button>

  <ul class="nav-links" id="nav-links">
    <li class="has-dropdown">
      <a href="{{ '/#servizi' | relative_url }}">Servizi</a>
      <ul class="nav-dropdown">
        {% for s in site.data.servizi %}
          <li>
            <a href="{{ '/#' | append: s.slug | relative_url }}">{{ s.nome | escape }}</a>
          </li>
        {% endfor %}
      </ul>
    </li>

    <li>
      <a href="{{ '/progetti.html' | relative_url }}"
         {% if page.layout == 'progetto' or page.url contains '/progetti' %}class="is-active" aria-current="page"{% endif %}>Progetti</a>
    </li>

    <li><a href="{{ '/#chi-siamo' | relative_url }}">Chi siamo</a></li>
    <li><a href="{{ '/#soci' | relative_url }}">Soci</a></li>

    <li>
      <a href="{{ '/blog.html' | relative_url }}"
         {% if page.layout == 'post' or page.url == '/blog.html' %}class="is-active" aria-current="page"{% endif %}>Blog</a>
    </li>

    <li>
      <a href="{{ '/contatti.html' | relative_url }}"
         class="nav-cta{% if page.url == '/contatti.html' %} is-active{% endif %}"
         {% if page.url == '/contatti.html' %}aria-current="page"{% endif %}>Contatti</a>
    </li>
  </ul>
</nav>
