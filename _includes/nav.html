<nav aria-label="Navigazione principale">
  <a class="nav-logo" href="{{ '/' | relative_url }}">
    <img src="{{ '/assets/img/brand/logo-mark.svg' | relative_url }}"
         alt=""
         width="46"
         height="46"
         class="nav-logo-img">
    <span class="nav-logo-text">{{ site.data.azienda.nome | escape }}</span>
  </a>

  <button class="menu-btn" type="button"
          aria-expanded="false"
          aria-controls="nav-links"
          aria-label="Apri menu">
    <span></span>
  </button>

  <ul class="nav-links" id="nav-links">
    <li><a href="{{ '/residenziale.html' | relative_url }}"{% if page.url == '/residenziale.html' %} class="is-active" aria-current="page"{% endif %}>Residenziale</a></li>
    <li><a href="{{ '/industriale.html' | relative_url }}"{% if page.url == '/industriale.html' %} class="is-active" aria-current="page"{% endif %}>Industriale</a></li>
    <li><a href="{{ '/urbanizzazioni.html' | relative_url }}"{% if page.url == '/urbanizzazioni.html' %} class="is-active" aria-current="page"{% endif %}>Urbanizzazioni</a></li>
    <li><a href="{{ '/progetti.html' | relative_url }}"{% if page.layout == 'progetto' or page.url contains '/progetti' %} class="is-active" aria-current="page"{% endif %}>Progetti</a></li>
    <li><a href="{{ '/chi-siamo/' | relative_url }}"{% if page.url == '/chi-siamo/' %} class="is-active" aria-current="page"{% endif %}>Chi siamo</a></li>
    <li><a href="{{ '/blog.html' | relative_url }}"{% if page.layout == 'post' or page.url == '/blog.html' %} class="is-active" aria-current="page"{% endif %}>Blog</a></li>
    <li>
      <a href="{{ '/contatti.html' | relative_url }}"
         class="nav-cta{% if page.url == '/contatti.html' %} is-active{% endif %}"
         {% if page.url == '/contatti.html' %}aria-current="page"{% endif %}>Contatti</a>
    </li>
  </ul>
</nav>

<script>
  (() => {
    const btn = document.querySelector('.menu-btn');
    const links = document.getElementById('nav-links');
    if (!btn || !links) return;

    const setOpen = open => {
      links.classList.toggle('is-open', open);
      btn.setAttribute('aria-expanded', String(open));
      btn.setAttribute('aria-label', open ? 'Chiudi menu' : 'Apri menu');
    };

    const header = document.querySelector('.site-header');
    if (header) {
      const update = () => header.classList.toggle('is-scrolled', window.scrollY > 40);
      window.addEventListener('scroll', update, { passive: true });
      update();
    }

    btn.addEventListener('click', () => setOpen(btn.getAttribute('aria-expanded') !== 'true'));
    links.addEventListener('click', e => { if (e.target.closest('a')) setOpen(false); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') setOpen(false); });
  })();
</script>
