<section class="hero" aria-labelledby="hero-title">
  <div class="hero-left">
    <h1 class="hero-title" id="hero-title">
      Costruiamo il Nord Est con passione dal 1972.
    </h1>

    <p class="hero-body">
      Opere <strong>residenziali, industriali e di urbanizzazione</strong>
      con tecnologie moderne e controllo diretto su ogni fase del cantiere.
    </p>

    <div class="hero-actions">
      <a href="{{ '/contatti.html' | relative_url }}" class="btn-primary">Richiedi un preventivo</a>
      <a href="{{ '/progetti.html' | relative_url }}" class="btn-ghost">Esplora i progetti</a>
    </div>
  </div>

  <div class="hero-right">
    <figure class="hero-media">
      <img
        src="{{ '/assets/img/progetti/hero-cantiere.jpg' | relative_url }}"
        alt="Cantiere edile Edil Crema nel Nord Est"
        width="1200"
        height="1350"
        loading="eager"
        fetchpriority="high"
        decoding="async"
      >
    </figure>

    <div class="hero-sectors">
      <p class="section-label" id="hero-areas-label">Aree di intervento</p>
      <ul class="area-list" aria-labelledby="hero-areas-label">
        <li class="area-item"><a href="{{ '/residenziale.html' | relative_url }}">Residenziale</a></li>
        <li class="area-item"><a href="{{ '/industriale.html' | relative_url }}">Industriale</a></li>
        <li class="area-item"><a href="{{ '/urbanizzazioni.html' | relative_url }}">Urbanizzazioni</a></li>
      </ul>
    </div>
