<a class="project-card" 
   href="{{ include.p.url | relative_url }}" 
   data-categoria="{{ include.p.tipologia | slugify }}">
  {% if include.p.cover %}
    <img src="{{ include.p.cover | relative_url }}" alt="{{ include.p.title }}" loading="lazy">
  {% endif %}
  <div class="project-meta">{{ include.p.tipologia }} · {{ include.p.luogo }}</div>
  <h3>{{ include.p.title }}</h3>
</a>
