title: Edil Crema
lang: it
timezone: Europe/Rome
url: "https://edoardo2496.github.io"
baseurl: "/edilcrema"

collections:
  progetti:
    output: true
    permalink: /progetti/:name/
  realizzazioni:
    output: true
    permalink: /nuove-realizzazioni/:name/

defaults:
  - scope: { path: "", type: "progetti" }
    values: { layout: progetto }
  - scope: { path: "", type: "realizzazioni" }
    values: { layout: realizzazione }
  - scope: { path: "", type: "posts" }
    values: { layout: post }
