<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.data.azienda.payoff }}">
  
  <!-- Anteprima condivisione social / WhatsApp (Open Graph) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.data.azienda.payoff }}">
  <meta property="og:image" content="{{ page.cover | default: '/assets/img/brand/og-cover.jpg' | absolute_url }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">

  <link rel="icon" type="image/png" href="{{ '/assets/img/brand/favicon.png' | relative_url }}">
  <!-- font: da scegliere con il rebranding -->
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    {% include nav.html %}
  </header>
  
  <main id="main-content">{{ content }}</main>
  
  {% include footer.html %}
</body>
</html>
