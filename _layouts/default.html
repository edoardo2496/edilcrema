<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1A2229">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.data.azienda.payoff }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Open Graph / anteprima social e WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="it_IT">
  <meta property="og:site_name" content="Edil Crema">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.data.azienda.payoff }}">
  <meta property="og:image" content="{{ page.cover | default: '/assets/img/brand/og-cover.jpg' | absolute_url }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/jpeg" href="{{ '/assets/img/brand/favicon.jpg' | relative_url }}">

  <!-- Font: Newsreader (titoli) + Hanken Grotesk (testo) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&display=swap">

  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main-content">Vai al contenuto</a>

  <header class="site-header">
    {% include nav.html %}
  </header>

  <main id="main-content">{{ content }}</main>

  {% include footer.html %}
</body>
</html>
