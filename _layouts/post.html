---
layout: default
---
<article class="page post-detail">
  <div class="section-label">
    {% if page.categoria %}{{ page.categoria }} · {% endif %}
    {{ page.date | date: "%d/%m/%Y" }}
  </div>
  
  <h1>{{ page.title }}</h1>

  {% if page.cover %}
    <figure class="post-hero-media">
      <img src="{{ page.cover | relative_url }}" alt="{{ page.title }}" loading="lazy">
    </figure>
  {% endif %}

  <div class="post-content">
    {{ content }}
  </div>

  <p class="back-link">
    <a href="{{ '/blog.html' | relative_url }}">← Tutti gli articoli</a>
  </p>
</article>
